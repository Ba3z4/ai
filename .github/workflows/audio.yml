name: Generar audio de las lecciones

on:
  push:
    paths:
      - 'ciberseguridad/audio/semana-*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - name: Generar MP3
        run: ./ciberseguridad/audio/generar-audio.sh
      - name: Guardar MP3 en el repositorio
        run: |
          git config user.name "audio-bot"
          git config user.email "audio-bot@users.noreply.github.com"
          git add ciberseguridad/audio/mp3
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Audio: regenera MP3 de las lecciones"
          git push
