<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionarios de ciberseguridad</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--mut:#5d6672;--ok:#137a3d;--okbg:#e2f5e9;--bad:#b3261e;--badbg:#fbe7e5;--acc:#2456d6;--bd:#d9dde3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--fg:#e8eaed;--card:#181c22;--mut:#9aa4b0;--ok:#5ad08a;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1a18;--acc:#7da3ff;--bd:#2c333c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.4em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:.9rem}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;width:100%;text-align:left;margin:6px 0;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
button:disabled{cursor:default}
button.ok{background:var(--okbg);border-color:var(--ok)}
button.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const QUIZZES = [{"id": "semana-01", "titulo": "Semana 1 · Cómo funciona una computadora", "preguntas": [{"leccion": "Sesión 1", "pregunta": "¿Qué componente ejecuta las instrucciones de los programas?", "opciones": ["La RAM", "La CPU", "El disco", "La placa base"], "correcta": 1, "explicacion": "La CPU (procesador) lee y ejecuta instrucciones. La RAM guarda temporalmente lo que se usa, el disco guarda de forma permanente y la placa base conecta todo."}, {"leccion": "Sesión 1", "pregunta": "Apagas el equipo. ¿Qué información se pierde?", "opciones": ["La del disco", "La de la RAM", "La de ambos", "Ninguna"], "correcta": 1, "explicacion": "La RAM es volátil: sin energía se vacía. El disco es no volátil y conserva los datos. Por eso una contraseña en uso (en RAM) puede ser objetivo de ataques mientras el equipo está encendido."}, {"leccion": "Sesión 1", "pregunta": "Abres un navegador. ¿Qué ocurre, en orden?", "opciones": ["Del disco a la RAM, y la CPU lo ejecuta", "De la CPU al disco, y la RAM lo ejecuta", "Se ejecuta directo desde el disco sin pasar por la RAM", "Se descarga siempre de Internet"], "correcta": 0, "explicacion": "El programa vive en el almacenamiento, se copia a la RAM y la CPU ejecuta sus instrucciones. La CPU no ejecuta desde el disco directamente porque sería demasiado lento."}, {"leccion": "Sesión 1", "pregunta": "Un equipo tiene poca RAM pero mucho disco libre y va muy lento. ¿Por qué?", "opciones": ["El disco libre ralentiza la CPU", "Al llenarse la RAM, el sistema usa el disco como memoria de emergencia, que es mucho más lento", "La placa base se sobrecalienta siempre", "El sistema operativo borra archivos"], "correcta": 1, "explicacion": "Cuando la RAM se agota, el sistema mueve datos al disco (memoria de intercambio o swap). Como el disco es mucho más lento que la RAM, todo se arrastra."}, {"leccion": "Sesión 2", "pregunta": "¿Cuál es la diferencia entre programa y proceso?", "opciones": ["Son lo mismo", "El programa es el archivo guardado; el proceso es el programa en ejecución", "El proceso es el archivo; el programa es lo que se ejecuta", "El proceso solo existe en Linux"], "correcta": 1, "explicacion": "Un programa es un archivo quieto. Al ejecutarlo se crea un proceso, con su propia memoria. Puedes tener varios procesos del mismo programa."}, {"leccion": "Sesión 2", "pregunta": "¿Por qué los programas normales piden al kernel acceder al hardware en vez de hacerlo ellos?", "opciones": ["Porque es más rápido", "Para que un programa defectuoso o malicioso no pueda controlar toda la máquina", "Porque el hardware no entiende programas", "Por compatibilidad con Windows"], "correcta": 1, "explicacion": "Esa separación es una barrera de seguridad: el kernel decide qué se permite. Si un atacante compromete el kernel, controla el sistema completo."}, {"leccion": "Sesión 2", "pregunta": "Ves un proceso llamado «svch0st.exe». ¿Qué deberías pensar?", "opciones": ["Es el legítimo svchost.exe, escrito distinto", "Es sospechoso: imita el nombre de un proceso legítimo (con un cero en vez de «o»)", "Es un proceso del kernel", "No importa el nombre"], "correcta": 1, "explicacion": "El malware suele usar nombres casi idénticos a procesos reales. Un analista siempre pregunta: ¿qué es?, ¿quién lo lanzó?, ¿desde qué ruta corre? y ¿tiene sentido que exista?"}, {"leccion": "Sesión 3", "pregunta": "¿Qué son los metadatos de un archivo?", "opciones": ["El contenido cifrado", "Datos sobre el archivo: tamaño, fechas, propietario, permisos", "Una copia de seguridad", "El virus que lleva"], "correcta": 1, "explicacion": "Los metadatos describen al archivo, no son su contenido. En forense permiten reconstruir quién hizo qué y cuándo."}, {"leccion": "Sesión 3", "pregunta": "Borras un archivo normalmente y vacías la papelera. ¿Qué pasa con su contenido?", "opciones": ["Se destruye inmediatamente", "Suele seguir en el disco hasta que se sobrescriba ese espacio", "Se envía a la nube", "Se mueve a la RAM"], "correcta": 1, "explicacion": "El borrado normal solo marca el espacio como libre. Por eso se puede recuperar. Para borrar de verdad se sobrescribe o se cifra el disco antes de desechar el equipo."}, {"leccion": "Sesión 3", "pregunta": "¿Qué es una partición?", "opciones": ["Un virus que divide archivos", "Una división lógica del disco, con su propio sistema de archivos", "Una carpeta oculta", "Un tipo de memoria RAM"], "correcta": 1, "explicacion": "Un disco se divide en particiones; cada una se organiza con un sistema de archivos como NTFS, ext4 o APFS."}, {"leccion": "Sesión 4", "pregunta": "¿Qué ventaja da la memoria virtual en seguridad?", "opciones": ["Hace el equipo más rápido siempre", "Cada proceso tiene su espacio aislado y no puede leer el de otro sin permiso", "Elimina todos los virus", "Cifra el disco"], "correcta": 1, "explicacion": "Cada proceso «cree» tener su memoria propia. El sistema traduce direcciones y evita que un proceso lea o escriba en la memoria de otro."}, {"leccion": "Sesión 4", "pregunta": "¿Qué guarda principalmente el stack (pila)?", "opciones": ["Los archivos del usuario", "Variables temporales de funciones y la dirección a la que volver", "El sistema operativo", "Las contraseñas cifradas"], "correcta": 1, "explicacion": "La pila funciona como una pila de platos: último en entrar, primero en salir. Guarda lo temporal de cada llamada a función. El heap, en cambio, guarda datos dinámicos de vida más larga."}, {"leccion": "Sesión 4", "pregunta": "¿Qué es un desbordamiento de búfer?", "opciones": ["Cuando el disco se llena", "Meter más datos de los que caben en un espacio reservado, pisando memoria vecina", "Un exceso de tráfico de red", "Una pantalla azul"], "correcta": 1, "explicacion": "Si se sobrescribe algo importante (como la dirección de retorno), el programa puede desviarse. Por eso es clave validar el tamaño de las entradas."}, {"leccion": "Sesión 4", "pregunta": "¿Cuál es la mejor defensa conceptual contra muchos desbordamientos?", "opciones": ["Apagar el equipo por la noche", "Validar el tamaño de las entradas y usar lenguajes/prácticas que controlan los límites", "Tener más RAM", "Usar contraseñas largas"], "correcta": 1, "explicacion": "El problema nace de no comprobar límites. Validar datos de entrada y usar lenguajes seguros con la memoria (o prácticas de programación segura) reduce mucho el riesgo. Más RAM no lo evita."}, {"leccion": "Sesión 3", "pregunta": "En Linux, ¿dónde esperas encontrar los registros (logs) del sistema?", "opciones": ["/var/log", "/home/fotos", "/bin/ls", "/dev/null"], "correcta": 0, "explicacion": "/var/log guarda los registros. /etc guarda la configuración y /home los archivos de los usuarios. Atacantes y defensores miran ahí."}, {"leccion": "Sesión 1", "pregunta": "¿Qué hace la placa base?", "opciones": ["Almacena tus fotos", "Conecta todos los componentes y por ella viajan los datos entre ellos", "Ejecuta los programas", "Protege de virus"], "correcta": 1, "explicacion": "La placa base es el «tablero» donde se conectan CPU, RAM, almacenamiento y demás. No ejecuta ni almacena por sí misma."}]}];
const app = document.getElementById('app');
const KEY = 'cs-quiz-v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
function el(h){ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function home(){
  const s = load();
  app.innerHTML = '<h1>Cuestionarios de ciberseguridad</h1><p class="mut">Responde, lee la explicación y repite lo que falles.</p>';
  QUIZZES.forEach(q=>{
    const h = (s[q.id]||{}).best;
    const c = el(`<div class="card"><strong>${esc(q.titulo)}</strong>
      <div class="mut">${q.preguntas.length} preguntas${h!=null?` · mejor resultado: ${h}%`:''}</div></div>`);
    const b = el('<button class="p">Empezar</button>');
    b.onclick = ()=>run(q, q.preguntas.map((_,i)=>i));
    c.appendChild(b);
    const fails = (s[q.id]||{}).fails||[];
    if(fails.length){
      const r = el(`<button class="p">Repasar fallos (${fails.length})</button>`);
      r.onclick = ()=>run(q, fails);
      c.appendChild(r);
    }
    app.appendChild(c);
  });
}

function run(quiz, idxs){
  const order = shuffle(idxs);
  let n = 0, hits = 0; const missed = [];
  function show(){
    const qi = order[n], q = quiz.preguntas[qi];
    const opts = shuffle(q.opciones.map((t,i)=>({t,i})));
    app.innerHTML = '';
    app.appendChild(el(`<div class="mut">${esc(quiz.titulo)} · ${n+1}/${order.length}</div>`));
    app.appendChild(el(`<div class="bar"><i style="width:${n/order.length*100}%"></i></div>`));
    const card = el(`<div class="card"><div class="mut">${esc(q.leccion)}</div><p><strong>${esc(q.pregunta)}</strong></p></div>`);
    const fb = el('<div></div>');
    opts.forEach(o=>{
      const b = el(`<button>${esc(o.t)}</button>`);
      b.onclick = ()=>{
        const right = o.i === q.correcta;
        if(right) hits++; else missed.push(qi);
        [...card.querySelectorAll('button')].forEach((x,k)=>{
          x.disabled = true;
          if(opts[k].i === q.correcta) x.classList.add('ok');
        });
        if(!right) b.classList.add('bad');
        fb.className = 'fb ' + (right?'ok':'bad');
        fb.innerHTML = `<strong>${right?'¡Correcto!':'No es esa.'}</strong><br>` +
          (right?'':`La respuesta correcta es: <em>${esc(q.opciones[q.correcta])}</em>.<br>`) + esc(q.explicacion);
        const nx = el(`<button class="p">${n+1<order.length?'Siguiente':'Ver resultado'}</button>`);
        nx.onclick = ()=>{ n++; n<order.length?show():end(); };
        fb.appendChild(nx);
      };
      card.appendChild(b);
    });
    card.appendChild(fb);
    app.appendChild(card);
  }
  function end(){
    const pct = Math.round(hits/order.length*100);
    const s = load(); const e = s[quiz.id]||{};
    if(order.length===quiz.preguntas.length) e.best = Math.max(e.best||0, pct);
    const prev = new Set(e.fails||[]);
    order.forEach(i=>prev.delete(i)); missed.forEach(i=>prev.add(i));
    e.fails = [...prev]; s[quiz.id]=e; save(s);
    const msg = pct>=85?'Dominado. Puedes seguir adelante.':pct>=60?'Vas bien. Repasa los fallos y vuelve a intentar.':'Aún no. Vuelve a escuchar las lecciones marcadas y repite.';
    app.innerHTML = `<h1>Resultado: ${hits}/${order.length} (${pct}%)</h1><p>${msg}</p>`;
    if(missed.length){
      const lecs = [...new Set(missed.map(i=>quiz.preguntas[i].leccion))].join(', ');
      app.appendChild(el(`<div class="card"><strong>Repasa:</strong> ${esc(lecs)}</div>`));
    }
    const a = el('<button class="p">Repasar fallos</button>'); a.onclick=()=>run(quiz, missed.slice());
    if(missed.length) app.appendChild(a);
    const h = el('<button class="p">Volver al inicio</button>'); h.onclick=home; app.appendChild(h);
  }
  show();
}
home();
</script>
</body>
</html>
